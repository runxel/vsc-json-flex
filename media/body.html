<div id="toolbar">
	<button id="btn-collapse" title="Collapse all">Collapse All</button>
	<button id="btn-expand" title="Expand all">Expand All</button>
	<span class="sep"></span>
	<button id="btn-prettify" title="Prettify the document">Prettify</button>
	<button id="btn-uglify" title="Uglify (minify) the document">Uglify</button>
	<span class="sep"></span>
	<div id="filter-box">
		<svg class="filter-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 2h13l-5 6v5l-3 1.5V8z" fill="none" stroke="currentColor" stroke-linejoin="round"/></svg>
		<input id="filter" type="text" placeholder="Filter JSON" spellcheck="false" title="Filter keys and values (Ctrl/Cmd+F). Esc clears.">
		<span id="filter-count"></span>
	</div>
	<button id="btn-text" title="Open as text">Text</button>
</div>
<div id="banner" hidden></div>
<div id="main">
	<div id="scroller" tabindex="0"><div id="viewport"><div id="rows"></div></div><div id="spacer"></div></div>
	<div id="divider" title="Drag to resize the key column"></div>
</div>
<div id="status">Loading…</div>
